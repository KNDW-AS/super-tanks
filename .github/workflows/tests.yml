name: tests

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:
    branches: [main, master]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # Test framework + runtime deps that test imports actually need.
          # We deliberately skip the heavy production deps (chromadb, torch,
          # playwright, etc.) — tests stub those.
          pip install \
            pytest==9.0.2 \
            pytest-asyncio==1.3.0 \
            pytest-timeout==2.4.0 \
            pytest-cov==7.1.0 \
            requests==2.32.5

      - name: Run test suite
        run: pytest --cov=core --cov=scripts --cov-report=term-missing:skip-covered --cov-fail-under=70

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage
          if-no-files-found: ignore

  quickstart:
    name: quickstart (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install exactly as the README says
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: doctor
        run: python -m supertanks doctor
      - name: seal + boot
        run: |
          python -m supertanks seal
          python -m supertanks boot
      - name: tests
        run: python -m pytest -q --no-cov -p no:cacheprovider
